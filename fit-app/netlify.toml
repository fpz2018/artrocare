# Deploy this folder as its own standalone Netlify site.
# In Netlify: "Add new site" → import this repo → set Base directory to
# `fit-app`. With that base directory, the paths below are relative to it.
[build]
  base = "fit-app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so client-side routing / refresh works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
